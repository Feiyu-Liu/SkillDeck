name: Use preinstalled Flutter
description: >-
  Puts a Flutter SDK already installed on a self-hosted runner on PATH, along
  with its bundled Dart, and checks that it is the expected version.

inputs:
  flutter-home:
    description: Root of the preinstalled Flutter SDK.
    required: true
  flutter-version:
    description: Framework version the SDK must report.
    required: true
  storage-base-url:
    description: FLUTTER_STORAGE_BASE_URL for artifact downloads.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Use preinstalled Flutter on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        PINNED_FLUTTER_HOME: ${{ inputs.flutter-home }}
        PINNED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        PINNED_FLUTTER_STORAGE_BASE_URL: ${{ inputs.storage-base-url }}
      run: |
        if [[ -z "$PINNED_FLUTTER_HOME" ]]; then
          echo 'The runner Flutter home is not configured.' >&2
          exit 1
        fi
        flutter="$PINNED_FLUTTER_HOME/bin/flutter"
        if [[ ! -x "$flutter" ]]; then
          echo "Flutter is missing from $flutter" >&2
          exit 1
        fi
        if [[ -n "$PINNED_FLUTTER_STORAGE_BASE_URL" ]]; then
          export FLUTTER_STORAGE_BASE_URL="$PINNED_FLUTTER_STORAGE_BASE_URL"
          printf 'FLUTTER_STORAGE_BASE_URL=%s\n' "$PINNED_FLUTTER_STORAGE_BASE_URL" >> "$GITHUB_ENV"
        fi
        version="$("$flutter" --version --machine | awk -F'"' '$2 == "frameworkVersion" { print $4; exit }')"
        if [[ "$version" != "$PINNED_FLUTTER_VERSION" ]]; then
          echo "Expected Flutter $PINNED_FLUTTER_VERSION, found $version" >&2
          exit 1
        fi
        printf '%s\n' "$PINNED_FLUTTER_HOME/bin" >> "$GITHUB_PATH"

    - name: Use preinstalled Flutter on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        PINNED_FLUTTER_HOME: ${{ inputs.flutter-home }}
        PINNED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        PINNED_FLUTTER_STORAGE_BASE_URL: ${{ inputs.storage-base-url }}
      run: |
        if (-not $env:PINNED_FLUTTER_HOME) {
          throw 'The runner Flutter home is not configured.'
        }
        $flutterBin = Join-Path $env:PINNED_FLUTTER_HOME 'bin'
        $flutter = Join-Path $flutterBin 'flutter.bat'
        if (-not (Test-Path $flutter)) {
          throw "Flutter is missing from $flutter"
        }
        if ($env:PINNED_FLUTTER_STORAGE_BASE_URL) {
          $env:FLUTTER_STORAGE_BASE_URL = $env:PINNED_FLUTTER_STORAGE_BASE_URL
          "FLUTTER_STORAGE_BASE_URL=$env:PINNED_FLUTTER_STORAGE_BASE_URL" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        $versionOutput = & $flutter --version --machine | Out-String
        $jsonStart = $versionOutput.IndexOf('{')
        if ($jsonStart -lt 0) {
          throw "Flutter did not return machine-readable output: $versionOutput"
        }
        $version = ($versionOutput.Substring($jsonStart) | ConvertFrom-Json).frameworkVersion
        if ($version -ne $env:PINNED_FLUTTER_VERSION) {
          throw "Expected Flutter $env:PINNED_FLUTTER_VERSION, found $version"
        }
        $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
