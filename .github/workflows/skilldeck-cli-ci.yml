name: SkillDeck CLI CI
on:
  pull_request:
    paths: ['packages/skilldeck_cli/**', '.github/**']
  push:
    branches: [main]
    paths: ['packages/skilldeck_cli/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # PRs use Linux; main/manual verification also covers macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/skilldeck_cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          native: 'false'
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
