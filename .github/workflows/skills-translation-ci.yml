name: Skills Translation CI
on:
  pull_request:
    paths: ['packages/skills_translation/**', '.github/**']
  push:
    branches: [main]
    paths: ['packages/skills_translation/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: translation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/skills_translation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          native: 'false'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
  minimum-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ['packages/skills_translation', 'packages/skills_translation/example']
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          flutter-version: '3.29.3'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Compile example with minimum supported SDK
        if: matrix.package == 'packages/skills_translation/example'
        run: flutter build linux --debug
  example-desktop-build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            device: macos
          - runner: windows-2022
            device: windows
          - runner: ubuntu-24.04
            device: linux
    defaults:
      run:
        working-directory: packages/skills_translation/example
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: flutter config --enable-${{ matrix.device }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.device }} --debug
