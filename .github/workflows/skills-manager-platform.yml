name: Skills Manager Platform Gate
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      device:
        required: true
        type: string
      tier:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: skills_manager
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      # Local ad-hoc identity only. No developer certificates or release signing.
      - name: Configure macOS debug test identity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          config="$RUNNER_TEMP/skilldeck-debug.xcconfig"
          printf '%s\n' 'CODE_SIGN_IDENTITY = -' 'CODE_SIGN_STYLE = Manual' 'DEVELOPMENT_TEAM =' 'PROVISIONING_PROFILE_SPECIFIER =' 'CODE_SIGN_ENTITLEMENTS =' > "$config"
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$config" >> "$GITHUB_ENV"
      - run: flutter config --enable-${{ inputs.device }}-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Seed verified SQLite downloads
        working-directory: .
        env:
          SQLITE_NATIVE_ASSET_CACHE: ${{ runner.temp }}/app-sqlite
        run: dart .github/scripts/sqlite_native_asset_cache.dart seed-current-platform
      - name: Restore verified SQLite downloads
        working-directory: .
        env:
          SQLITE_NATIVE_ASSET_CACHE: ${{ runner.temp }}/app-sqlite
          SQLITE_NATIVE_ASSET_SOURCE: ${{ github.workspace }}/skills_manager/.dart_tool/hooks_runner/shared/sqlite3/build
        run: dart .github/scripts/sqlite_native_asset_cache.dart restore
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos --no-pub
      - run: flutter test --no-pub
      - name: macOS desktop E2E in isolated hosts
        if: inputs.tier == 'merge' && runner.os == 'macOS'
        shell: bash
        run: |
          cases=(
            'real desktop UI acquires, activates, updates, and removes a local Skill'
            'real desktop UI confirms takeover of a dangling legacy activation link'
            'real desktop UI adopts a read-only external Skill and reopens cleanly'
            'real App adapter handles project scope, adoption, and unmanaged collision'
            'real App adapter resumes committed finalization after reopening'
            'real App adapter persists Library data and preserves identity on source replacement'
          )
          for test_name in "${cases[@]}"; do
            flutter test --no-pub -d macos integration_test/skills_manager_desktop_e2e_test.dart --name "$test_name" --timeout 5m --reporter expanded
          done
      - name: Windows desktop E2E
        if: inputs.tier == 'merge' && runner.os == 'Windows'
        run: flutter test --no-pub -d windows integration_test/skills_manager_desktop_e2e_test.dart --timeout 5m --reporter expanded
