include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**

linter:
  rules:
    - avoid_dynamic_calls
    - directives_ordering
    - discarded_futures
    - prefer_final_locals
    - public_member_api_docs
    - sort_constructors_first
    - unawaited_futures
    - use_super_parameters
